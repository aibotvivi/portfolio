# The Healer's proxy. The browser never sees the API key: it lives here as a
# secret (`npx wrangler secret put ANTHROPIC_API_KEY`), never in this file.
name = "healer"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Pages allowed to call this Worker. Anything else gets a 403 before a token is spent.
ALLOWED_ORIGINS = "https://aibotvivi.github.io,http://localhost:8090,http://127.0.0.1:8090"

# Ten questions a minute per visitor address. A spend cap in the Anthropic
# Console is the real ceiling; this only stops one tab hammering it.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

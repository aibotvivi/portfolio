<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography — Vivien Chin</title>
<meta name="description" content="Travel photography by Vivien Chin — South Korea, Japan, Nepal, the UK, South Africa, Spain and Hong Kong.">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/img/favicon.png">
<style>
@font-face { font-family:'Spectral'; font-style:normal; font-weight:300; font-display:swap; src:url('assets/fonts/spectral-300.woff2') format('woff2'); }
@font-face { font-family:'Spectral'; font-style:italic; font-weight:300; font-display:swap; src:url('assets/fonts/spectral-300-italic.woff2') format('woff2'); }
@font-face { font-family:'Spectral'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/spectral-400.woff2') format('woff2'); }
@font-face { font-family:'Satoshi'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/satoshi-400.woff2') format('woff2'); }
@font-face { font-family:'Satoshi'; font-style:normal; font-weight:500; font-display:swap; src:url('assets/fonts/satoshi-500.woff2') format('woff2'); }
@font-face { font-family:'Satoshi'; font-style:normal; font-weight:700; font-display:swap; src:url('assets/fonts/satoshi-700.woff2') format('woff2'); }

:root {
  --font-display:'Spectral', Georgia, 'Times New Roman', serif;
  --font-ui:'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --frame:         #DCD9CF;
  --frame-ink:     #1F1F1F;
  --frame-body:    #55514A;
  --frame-line:    rgba(31,31,31,.18);
  --frame-hover:   rgba(31,31,31,.07);
  --bg:            #F5F3ED;
  --surface:       #FFFFFF;
  --hairline:      #DBD7CA;
  --ink:           #1F1F1F;
  --ink-soft:      #444444;
  --body:          #5A5A5A;
  --accent:        #B5652E;
  --r-md: 14px;
  --r-pill: 999px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }

.frame-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px clamp(14px, 3vw, 28px); background: var(--frame); color: var(--frame-ink);
}
.frame-bar .brand { display: flex; align-items: center; }
.frame-bar .brand img { height: 26px; width: auto; }
.back-link {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .92rem; font-weight: 500; color: var(--frame-body);
  text-decoration: none; padding: .5rem .9rem; border-radius: var(--r-pill);
  transition: color .2s var(--ease), background-color .2s var(--ease);
}
.back-link:hover { color: var(--frame-ink); background: var(--frame-hover); }

.container { max-width: 1080px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 28px); }

.quote-block { text-align: center; padding: clamp(3rem, 8vw, 6rem) 1rem 3rem; }
.quote-block blockquote {
  margin: 0 auto; max-width: 34ch;
  font-family: var(--font-display); font-weight: 300; font-style: italic;
  font-size: clamp(1.5rem, 3.2vw, 2rem); line-height: 1.3; color: var(--ink);
}
.quote-block cite {
  display: block; margin-top: 1rem; font-style: normal;
  font-size: .8rem; font-weight: 700; letter-spacing: .12em; color: var(--accent);
}

.photo-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem;
  padding-bottom: clamp(3rem, 8vw, 6rem);
}
@media (max-width: 720px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 440px) { .photo-grid { grid-template-columns: 1fr; } }

.photo-card {
  position: relative; margin: 0; border-radius: var(--r-md); overflow: hidden;
  aspect-ratio: 3 / 4; background: var(--hairline);
  box-shadow: 0 1px 2px rgba(31,31,31,.05), 0 8px 22px rgba(31,31,31,.06);
}
.photo-card img { width: 100%; height: 100%; object-fit: cover; }
.photo-card figcaption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 1.6rem .9rem .8rem;
  background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
  color: #fff; font-size: .74rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase;
}

.site-footer { text-align: center; padding: 0 0 3rem; color: var(--body); font-size: .84rem; }
</style>
</head>
<body>

<div class="frame-bar">
  <a class="brand" href="index.html" aria-label="Vivien Chin — home">
    <img src="assets/img/logo-chin.png" alt="Ch-in — Vivien Chin wordmark">
  </a>
  <a class="back-link" href="index.html#contact">← Back to portfolio</a>
</div>

<div class="container">
  <div class="quote-block">
    <blockquote>&ldquo;Life is like riding a bicycle. To keep your balance you must keep moving.&rdquo;</blockquote>
    <cite>Albert Einstein</cite>
  </div>

  <div class="photo-grid">
    <figure class="photo-card"><img src="assets/img/photography/01-south-korea-1.png" alt="Traditional Korean temple roof against a cloudy sky"><figcaption>South Korea</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/02-japan-1.png" alt="Red pagoda against a clear blue sky"><figcaption>Japan</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/03-japan-2.png" alt="A wooden pirate-style boat on a lake surrounded by mountains"><figcaption>Japan</figcaption></figure>

    <figure class="photo-card"><img src="assets/img/photography/04-japan-3.png" alt="Grassy hillside path leading to a red torii gate by the sea"><figcaption>Japan</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/05-nepal-1.png" alt="Two monkeys sitting close together"><figcaption>Nepal</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/06-nepal-2.png" alt="Prayer flags strung above a stupa"><figcaption>Nepal</figcaption></figure>

    <figure class="photo-card"><img src="assets/img/photography/07-nepal-3.png" alt="Pink buildings viewed through a window"><figcaption>Nepal</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/08-nepal-4.png" alt="Golden stupa spire with prayer flags"><figcaption>Nepal</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/09-japan-4.png" alt="Checkerboard pattern of moss and stone tiles"><figcaption>Japan</figcaption></figure>

    <figure class="photo-card"><img src="assets/img/photography/10-japan-5.png" alt="Tree-lined road in autumn with a parked car"><figcaption>Japan</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/11-japan-6.png" alt="Red autumn maple leaves over a rooftop"><figcaption>Japan</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/12-united-kingdom-1.png" alt="Glasses of champagne and a plate of dark chocolates on a table"><figcaption>United Kingdom</figcaption></figure>

    <figure class="photo-card"><img src="assets/img/photography/13-south-africa-1.png" alt="A glass of champagne held up outside a white building"><figcaption>South Africa</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/14-south-africa-2.png" alt="Latte art in a cup on a saucer with a biscuit"><figcaption>South Africa</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/15-south-africa-3.png" alt="Penguins on a rocky beach with turquoise water"><figcaption>South Africa</figcaption></figure>

    <figure class="photo-card"><img src="assets/img/photography/16-spain-1.png" alt="An ornate golden religious statue against a blue sky"><figcaption>Spain</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/17-hong-kong-1.png" alt="Upward view of a modern building facade with circular windows"><figcaption>Hong Kong</figcaption></figure>
    <figure class="photo-card"><img src="assets/img/photography/18-nepal-5.png" alt="Hand holding a small bell at a market stall"><figcaption>Nepal</figcaption></figure>
  </div>
</div>

<p class="site-footer">© 2026 Vivien Chin · London</p>

</body>
</html>

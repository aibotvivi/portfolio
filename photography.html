<!-- Google Analytics 4, kept in Google's own wording so their installation check
     can find it: that check reads the HTML as served and does not run the page,
     so a tag assembled in JavaScript reports as "not detected" even while it is
     working. The only third-party script here, and so a deliberate exception to
     the no-CDN rule in CLAUDE.md — gtag.js cannot be self-hosted. The id appears
     twice below and again in the other page; change all three together, or
     delete both script tags to switch analytics off. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NW60T4SQ4X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NW60T4SQ4X');
</script>
<script>
/* Same pre-paint theme resolution as index.html, reading the same storage key,
   so arriving here from a dark portfolio does not flash a white page. */
(function () {
  try {
    var stored = localStorage.getItem('vc-theme');
    var mode = (stored === 'dark' || stored === 'light') ? stored
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', mode);
  } catch (e) { /* file:// can block storage */ }
}());
</script>
<style>
@font-face { font-family:'Spectral'; font-style:normal; font-weight:300; font-display:swap; src:url('assets/fonts/spectral-300.woff2') format('woff2'); }
@font-face { font-family:'Spectral'; font-style:italic; font-weight:300; font-display:swap; src:url('assets/fonts/spectral-300-italic.woff2') format('woff2'); }
@font-face { font-family:'Spectral'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/spectral-400.woff2') format('woff2'); }
@font-face { font-family:'Satoshi'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/satoshi-400.woff2') format('woff2'); }
@font-face { font-family:'Satoshi'; font-style:normal; font-weight:500; font-display:swap; src:url('assets/fonts/satoshi-500.woff2') format('woff2'); }

:root {
  --font-display:'Spectral', Georgia, 'Times New Roman', serif;
  --font-ui:'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --frame:         #DCD9CF;
  --frame-ink:     #1F1F1F;
  --frame-body:    #55514A;
  --frame-line:    rgba(31,31,31,.18);
  --frame-hover:   rgba(31,31,31,.07);
  --bg:            #F5F3ED;
  --surface:       #FFFFFF;
  --hairline:      #DBD7CA;
  --ink:           #1F1F1F;
  --ink-soft:      #444444;
  --body:          #5A5A5A;
  --accent:        #B5652E;
  --logo-invert:   0;
  --r-md: 14px;
  --r-pill: 999px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

/* Dark values mirror index.html's :root[data-theme="dark"] block — keep the two
   in step, they are separate token scopes in separate files. */
:root[data-theme="dark"] {
  --frame:         #0E0E0E;
  --frame-ink:     #EDEDED;
  --frame-body:    #9A9A9A;
  --frame-line:    rgba(255,255,255,.16);
  --frame-hover:   rgba(255,255,255,.09);
  --bg:            #161616;
  --surface:       #242424;
  --hairline:      rgba(255,255,255,.16);
  --ink:           #F4F4F4;
  --ink-soft:      #D2D2D2;
  --body:          #A6A6A6;
  --accent:        #D98A50;
  --logo-invert:   1;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }

.frame-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px clamp(14px, 3vw, 28px); background: var(--frame); color: var(--frame-ink);
}
.frame-bar .brand { display: flex; align-items: center; }
.frame-bar .brand img { height: 26px; width: auto; filter: invert(var(--logo-invert)); transition: filter .35s var(--ease); }
.back-link {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .92rem; font-weight: 500; color: var(--frame-body);
  text-decoration: none; padding: .5rem .9rem; border-radius: var(--r-pill);
  transition: color .2s var(--ease), background-color .2s var(--ease);
}
.back-link:hover { color: var(--frame-ink); background: var(--frame-hover); }

.frame-right { display: flex; align-items: center; gap: .4rem; }
.theme-toggle {
  width: 38px; height: 38px; display: grid; place-items: center; flex-shrink: 0;
  border: 1px solid var(--frame-line); border-radius: var(--r-pill);
  background: none; color: var(--frame-ink); cursor: pointer;
  transition: background-color .2s var(--ease);
}
.theme-toggle:hover { background: var(--frame-hover); }
.theme-toggle .moon { display: none; }
:root[data-theme="dark"] .theme-toggle .moon { display: block; }
:root[data-theme="dark"] .theme-toggle .sun { display: none; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 6px; }

.container { max-width: 1080px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 28px); }

.quote-block { text-align: center; padding: clamp(3rem, 8vw, 6rem) 1rem 3rem; }
.quote-block blockquote {
  margin: 0 auto; max-width: 34ch;
  font-family: var(--font-display); font-weight: 300; font-style: italic;
  font-size: clamp(1.5rem, 3.2vw, 2rem); line-height: 1.3; color: var(--ink);
}
.quote-block cite {
  display: block; margin-top: 1rem; font-style: normal;
  font-size: .8rem; font-weight: 700; letter-spacing: .12em; color: var(--accent);
}

.photo-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem;
  padding-bottom: clamp(3rem, 8vw, 6rem);
}
@media (max-width: 720px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 440px) { .photo-grid { grid-template-columns: 1fr; } }

.photo-card {
  position: relative; margin: 0; border-radius: var(--r-md); overflow: hidden;
  aspect-ratio: 3 / 4; background: var(--hairline);
  box-shadow: 0 1px 2px rgba(31,31,31,.05), 0 8px 22px rgba(31,31,31,.06);
}
.photo-card img { width: 100%; height: 100%; object-fit: cover; }
.photo-card figcaption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 1.6rem .9rem .8rem;
  background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
  color: #fff; font-size: .74rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase;
}

.site-footer { text-align: center; padding: 0 0 3rem; color: var(--body); font-size: .84rem; }
</style>
</head>
<body>

<p class="site-footer">© 2026 Vivien Chin · London</p>

<script>
(function () {
  var root = document.documentElement;
  var toggle = document.getElementById('theme-toggle');
  function label() {
    toggle.setAttribute('aria-label',
      root.getAttribute('data-theme') === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }
  label();
  toggle.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    label();
    try { localStorage.setItem('vc-theme', next); } catch (e) { /* ignore */ }
  });
}());
</script>
